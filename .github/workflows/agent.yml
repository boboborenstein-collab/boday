name: agent

on:
  push:
    paths:
      - 'agent/**'
      - 'scripts/gen-recurrence-parity.ts'
      - 'src/lib/recurrence.ts'
      - '.github/workflows/agent.yml'
  pull_request:
    paths:
      - 'agent/**'
      - 'scripts/gen-recurrence-parity.ts'
      - 'src/lib/recurrence.ts'
      - '.github/workflows/agent.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q

  parity-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: TZ=America/New_York npx tsx scripts/gen-recurrence-parity.ts > /tmp/parity.json
      - run: diff /tmp/parity.json agent/tests/fixtures/recurrence_parity.json
