- "id": "tf-search-error"
  "category": "tool_failures"
  "label": "either"
  "split": "dev"
  "fixture": "typical_week"
  "turns":
  - "user": "move my dentist to tommorow"
  "expect":
    "accept":
    - "outcome": "proposed"
      "changes":
      - "op": "update"
        "task": "dentist"
        "fields":
          "scheduledDate": "2026-10-21"
    - "outcome": "answered"
  "faults":
