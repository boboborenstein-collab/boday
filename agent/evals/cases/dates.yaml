- id: next-friday-dentist
  category: dates
  label: either
  split: dev
  fixture: typical_week
  turns:
  - user: move my dentist to next friday
  expect:
    accept:
    - outcome: asked
    - outcome: proposed
      changes:
      - op: update
        task: dentist
        fields:
          scheduledDate: '2026-10-23'
