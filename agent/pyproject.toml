[project]
name = "boday-agent"
version = "0.1.0"
description = "BoDay LLM agent tools (phase 1)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-dateutil>=2.9",
    "pyyaml>=6",
]

[project.scripts]
boday-eval = "boday_agent.evals.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
boday-agent = "boday_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["boday_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
